<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino Live</title>
    <style>
        #chat-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 300px;
            height: 400px;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            display: none;
            z-index: 1000;
        }

        #chat-header {
            background-color: #007bff;
            color: white;
            padding: 10px;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            text-align: center;
            cursor: pointer;
        }

        #chat-messages {
            height: 300px;
            overflow-y: auto;
            padding: 10px;
        }

        #chat-input {
            display: flex;
            padding: 10px;
        }

        #chat-input input {
            flex: 1;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        #chat-input button {
            margin-left: 5px;
            padding: 5px 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .games-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            margin-top: 20px;
        }

        .game-option {
            text-align: center;
            margin: 10px;
        }

        .game-option img {
            width: 100px;
            height: 100px;
        }
    </style>
</head>
<body>
    <h1>Welcome to Casino Live!</h1>
    <form action="/register" method="POST">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        <button type="submit">Register</button>
    </form>
    <h2>Users:</h2>
    <ul>
        {% for user in users %}
        <li>
            {{ user.username }} - Balance: ${{ user.balance }}
            <a href="/roll-dice/{{ user.username }}">Play Dice Game</a> |
            <a href="/slot-machine/{{ user.username }}">Play Slot Machine</a> |
            <a href="/poker/{{ user.username }}">Play Poker</a> |
            <a href="/blackjack/{{ user.username }}">Play Blackjack</a>
        </li>
        {% endfor %}
    </ul>

    <div class="games-container">
        <h2>Choose Your Game</h2>
        <div class="game-option">
            <a href="{{ url_for('roll_dice') }}">
                <img src="{{ url_for('static', filename='images/dice.png') }}" alt="Dice Game">
                <p>Roll the Dice</p>
            </a>
        </div>
        <div class="game-option">
            <a href="{{ url_for('blackjack') }}">
                <img src="{{ url_for('static', filename='images/cards.png') }}" alt="Blackjack">
                <p>Play Blackjack</p>
            </a>
        </div>
        <div class="game-option">
            <a href="{{ url_for('slot_machine') }}">
                <img src="{{ url_for('static', filename='images/slot_machine.png') }}" alt="Slot Machine">
                <p>Slot Machine</p>
            </a>
        </div>
        <div class="game-option">
            <a href="{{ url_for('poker') }}">
                <img src="{{ url_for('static', filename='images/poker.png') }}" alt="Poker">
                <p>Play Poker</p>
            </a>
        </div>
    </div>

    <div id="chat-container">
        <div id="chat-header">Chat</div>
        <div id="chat-messages"></div>
        <div id="chat-input">
            <input type="text" id="chat-message" placeholder="Type a message...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <button onclick="toggleChat()" style="position: fixed; bottom: 20px; right: 20px; z-index: 1000;">Chat</button>

    <script>
        function toggleChat() {
            const chatContainer = document.getElementById('chat-container');
            if (chatContainer.style.display === 'none' || chatContainer.style.display === '') {
                chatContainer.style.display = 'block';
            } else {
                chatContainer.style.display = 'none';
            }
        }

        function sendMessage() {
            const messageInput = document.getElementById('chat-message');
            const message = messageInput.value;
            if (message.trim() !== '') {
                const chatMessages = document.getElementById('chat-messages');
                const messageElement = document.createElement('div');
                messageElement.textContent = message;
                chatMessages.appendChild(messageElement);
                messageInput.value = '';
            }
        }
    </script>
</body>
</html>
