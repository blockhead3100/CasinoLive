{% extends 'base.html' %}

{% block content %}
<h1>Admin Dashboard</h1>

<!-- Button to reset all user balances -->
<form action="{{ url_for('reset_balances') }}" method="post">
    <button type="submit" class="btn btn-danger">Reset All User Balances</button>
</form>

<!-- Chat toggle button -->
<button id="chat-toggle" class="btn btn-primary">Toggle Chat</button>

<!-- Chat container -->
<div id="chat-container" style="display: none; margin-top: 20px;">
    <h2>Chat</h2>
    <p>Chat functionality coming soon...</p>
</div>

<script>
    // JavaScript to toggle chat visibility
    document.getElementById('chat-toggle').addEventListener('click', function() {
        const chatContainer = document.getElementById('chat-container');
        if (chatContainer.style.display === 'none') {
            chatContainer.style.display = 'block';
        } else {
            chatContainer.style.display = 'none';
        }
    });
</script>

{% endblock %}
